# Bun configuration file
# https://bun.sh/docs/runtime/bunfig

[test]
# Note: bun 1.3 has no testMatch/pathIgnorePatterns exclude support.
# E2E files use .e2e.ts extension so bun's default *.spec.ts pattern does not match them.
# Run E2E tests with: bun run test:e2e (uses Playwright)

# Enable code coverage reporting
coverage = true

# Coverage thresholds - disabled for integration tests
# coverageThreshold = { lines = 80, functions = 80, statements = 80 }

# Watch for changes during testing
# watch = true

# Test timeout in milliseconds — bunfig.toml timeout not respected by bun 1.3;
# --timeout 30000 added to package.json test scripts instead.
# timeout = 5000

# Preload test setup file for happy-dom initialization
preload = ["./tests/setup.ts"]

[install]
# Use exact versions in lockfile
exact = true

[run]
# Silent mode for cleaner output
silent = false
