pre-commit:
  parallel: true
  commands:
    test:
      glob: "*.{ts,tsx}"
      run: bun test tests/lib/
      fail_text: "Unit tests failed. Fix failing tests before committing."

# Note: Integration tests (auth, rls, neon-auth) require proper RLS auth context.
# These run in CI with proper database setup, not in pre-commit.

pre-push:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun run lint
      fail_text: "Lint check failed. Run 'bun run lint:fix' to auto-fix."

    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
      fail_text: "TypeScript errors found. Fix type errors before pushing."
