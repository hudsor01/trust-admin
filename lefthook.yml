pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun run lint
      fail_text: "Lint check failed. Run 'bunx biome check --write .' to auto-fix."

    test:
      glob: "*.{ts,tsx}"
      run: bun run test
      fail_text: "Tests failed. Fix failing tests before committing."

pre-push:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
      fail_text: "TypeScript errors found. Fix type errors before pushing."
