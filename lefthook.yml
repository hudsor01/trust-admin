pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun run lint {staged_files}
      stage_fixed: true

    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck

    test:
      glob: "*.{ts,tsx}"
      run: bun run test:unit

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck

    test:
      run: bun run test:unit
