# .github/workflows/deploy.yml
# Triggered only on push to main (not on PRs — avoid double builds)
# Sequence: typecheck + lint + test → db:deploy (drizzle migrations) → docker buildx push (ghcr + forgejo) → done
# Image automation in the K3s cluster handles the tag bump + rollout.

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Run Drizzle migrations
        run: bun run db:deploy
        env:
          # Must be the DIRECT Neon connection (no PgBouncer) — drizzle.config.ts requires
          # DATABASE_URL_DIRECT || DATABASE_URL because PgBouncer rejects prepared statements.
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

      - name: Generate timestamp tag
        id: tag
        run: echo "TAG=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.thehudsonfam.com
          username: forgejo-admin
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hudsor01/trust-admin:${{ steps.tag.outputs.TAG }}
            git.thehudsonfam.com/dev-projects/trust-admin:${{ steps.tag.outputs.TAG }}
          build-args: |
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
