# .github/workflows/deploy.yml
# Triggered only on push to main (not on PRs — avoid double builds).
# Sequence: typecheck + lint + test → drizzle migrate → docker buildx push (ghcr + forgejo)
# Image automation in the K3s cluster handles the tag bump + rollout.
#
# Auth model:
#   - ghcr.io push: ${{ secrets.GITHUB_TOKEN }} (auto-issued, repo `packages: write`)
#   - Forgejo push: ${{ secrets.FORGEJO_REGISTRY_TOKEN }} (forgejo-admin user PAT, write:packages)
#   - Drizzle migrations: ${{ secrets.DATABASE_URL }} (drizzle.config.ts falls back from DATABASE_URL_DIRECT)
#   - Sentry sourcemaps: disabled via withSentryConfig sourcemaps.disable when SENTRY_AUTH_TOKEN is empty
#
# All actions pinned to full SHAs per repo policy (matches ci.yml).

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.3.9

      - name: Cache bun install
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.9-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.9-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Lint
        run: bun run lint

      # Tests intentionally NOT run in deploy.yml — they're integration tests
      # requiring a real Neon DB connection (see /tests/api/* and tests/lib/auth/*).
      # ci.yml is the test gate for code correctness; deploy.yml's gate is
      # typecheck + lint + drizzle migrate (which itself fails fast on schema drift).

      - name: Run Drizzle migrations
        run: bun run db:deploy
        env:
          # drizzle.config.ts: const databaseUrl = process.env.DATABASE_URL_DIRECT || process.env.DATABASE_URL
          # Existing repo secret DATABASE_URL is the value of record.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate timestamp tag
        id: tag
        run: echo "TAG=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Forgejo Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: git.thehudsonfam.com
          username: forgejo-admin
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hudsor01/trust-admin:${{ steps.tag.outputs.TAG }}
            git.thehudsonfam.com/dev-projects/trust-admin:${{ steps.tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
