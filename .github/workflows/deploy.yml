# .github/workflows/deploy.yml
# Triggered only on push to main (not on PRs — avoid double builds).
# Sequence: typecheck + lint + test → drizzle migrate → docker buildx push (ghcr + forgejo)
# Image automation in the K3s cluster handles the tag bump + rollout.
#
# Auth model:
#   - ghcr.io push: ${{ secrets.GITHUB_TOKEN }} (auto-issued, repo `packages: write`)
#   - Forgejo push: ${{ secrets.FORGEJO_REGISTRY_TOKEN }} (forgejo-admin user PAT, write:packages)
#   - Drizzle migrations: ${{ secrets.DATABASE_URL }} (drizzle.config.ts falls back from DATABASE_URL_DIRECT)
#   - Sentry sourcemaps: disabled via withSentryConfig sourcemaps.disable when SENTRY_AUTH_TOKEN is empty

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Run Drizzle migrations
        run: bun run db:deploy
        env:
          # drizzle.config.ts: const databaseUrl = process.env.DATABASE_URL_DIRECT || process.env.DATABASE_URL
          # Existing repo secret DATABASE_URL is the value of record.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate timestamp tag
        id: tag
        run: echo "TAG=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.thehudsonfam.com
          username: forgejo-admin
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hudsor01/trust-admin:${{ steps.tag.outputs.TAG }}
            git.thehudsonfam.com/dev-projects/trust-admin:${{ steps.tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
