# CI — Trust Admin
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL            Neon pooled connection string (sslmode=require)
#   NEON_AUTH_BASE_URL      Neon Auth base URL for the project
#   ADMIN_EMAIL             Trust owner email (always gets admin role)
#   ANTHROPIC_API_KEY       Claude API key (for AI-assisted features)
#   UPLOADTHING_TOKEN       UploadThing token for file uploads
#   NEXT_PUBLIC_SENTRY_DSN  Sentry DSN (public, client-side)
#   SENTRY_DSN              Sentry DSN (server-side)
#   SENTRY_ORG              Sentry organization slug
#   SENTRY_PROJECT          Sentry project slug
#   SENTRY_AUTH_TOKEN       Sentry auth token (for source map upload)
#   NEON_AUTH_COOKIE_SECRET Cookie signing secret for Neon Auth sessions

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Quality Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.3.9

      - name: Cache dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.9-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.9-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint check
        run: bun run lint

      - name: TypeScript type check
        run: bun run typecheck

      - name: Build Next.js application
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}