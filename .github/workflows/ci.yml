# CI — Trust Admin
#
# Env validation strategy:
#   - Build step uses SKIP_ENV_VALIDATION=1 — no app secrets required in CI.
#   - instrumentation.ts validates all required vars at server startup.
#   - Vercel injects real secrets during its own build + deployment.
#
# Optional GitHub secrets (only needed for Sentry source map uploads):
#   SENTRY_ORG              Sentry organization slug
#   SENTRY_PROJECT          Sentry project slug
#   SENTRY_AUTH_TOKEN       Sentry auth token (for source map upload)

name: CI

on:
  # Docs-only changes can't break the build — paths-ignore skips the
  # whole job when every changed file matches. Any non-doc file touched
  # in the same PR will still trigger CI normally.
  #
  # WARNING: do NOT add this workflow as a required status check on main.
  # GitHub records a paths-ignore-skipped run as "expected/pending" rather
  # than "success" against required checks, which would silently block
  # docs-only PRs from merging. If a required check is ever needed, switch
  # to a wrapper-job pattern (see below) instead of paths-ignore:
  #
  #   1. Add a `changes` job using dorny/paths-filter to compute outputs.
  #   2. Make `quality-checks` conditional on changes.outputs.code == 'true'.
  #   3. Add a `quality-checks-skip` job named "Quality Checks" that runs
  #      `if: changes.outputs.code != 'true'` and reports success — same
  #      check name satisfies branch protection on docs-only PRs.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - 'LICENSE'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Quality Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: 1.3.9

      - name: Cache bun install
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.9-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.9-

      - name: Cache Next.js build
        # Restored before build so webpack can reuse compiled modules
        # across runs. Exact-key match means (deps + every file actually
        # consumed by `next build`) is unchanged → near-no-op rebuild;
        # restore-keys fall back to the last build with the same deps
        # for incremental compile when sources change.
        #
        # The hashed file set deliberately excludes tests/ and scripts/
        # (excluded from the TS program in tsconfig.json, never imported
        # by the build) so test-only edits keep the exact-match cache
        # warm. Includes root build configs (next.config.ts,
        # postcss.config.mjs, sentry.*.config.ts, instrumentation*.ts)
        # whose changes legitimately invalidate the build cache.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx', 'db/**/*.ts', 'next.config.ts', 'postcss.config.mjs', 'sentry.*.config.ts', 'instrumentation*.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint check
        run: bun run lint

      # No dedicated `bun run typecheck` step — `next build` runs tsc
      # internally and fails on type errors. Run typecheck locally via
      # `bun run typecheck` for fast feedback before pushing.
      #
      # IMPORTANT: this guarantee depends on `next.config.ts` NOT setting
      # `typescript: { ignoreBuildErrors: true }`. If that ever changes,
      # type errors will silently land in main — re-add an explicit
      # `bun run typecheck` step here, or remove the ignoreBuildErrors flag.
      - name: Build Next.js application
        run: bun run build
        env:
          # Skip Zod env validation at build time — instrumentation.ts handles
          # strict validation at server startup. Vercel injects real secrets
          # during its own build; CI only needs to verify the code compiles.
          SKIP_ENV_VALIDATION: "1"
          # Neon Auth requires cookies.secret at module initialization time (not just
          # at request time), so Next.js fails during page data collection without it.
          # This placeholder satisfies the library; no real cookies are signed in CI.
          NEON_AUTH_COOKIE_SECRET: "ci-build-placeholder-not-used-for-real-auth-xxxxxx"
          # Sentry source map upload — optional, build proceeds without them
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}