# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # bun, not npm. This repo's lockfile is bun.lock, and CI installs with
  # `bun install --frozen-lockfile`. The npm updater edits package.json but
  # cannot write bun.lock, so every PR it opened failed at install with
  # "lockfile had changes, but lockfile is frozen".
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    # Group version-locked package families into a single PR. These
    # families must bump in lockstep — a single-package PR splits their
    # shared core (e.g. @tanstack/query-core, @tanstack/form-core) into
    # two installed copies, producing duplicate-type build errors.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
      sentry:
        patterns:
          - "@sentry/*"