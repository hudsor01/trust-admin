# PostgreSQL Configuration for Trust Administration System
# Optimized for data integrity, security, and auditability

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================
listen_addresses = '*'
port = 5432
max_connections = 100

# =============================================================================
# MEMORY SETTINGS
# =============================================================================
# Shared memory for caching (25% of available RAM is typical)
shared_buffers = 256MB

# Memory per operation (sorting, hashing)
work_mem = 16MB

# Memory for maintenance operations (VACUUM, CREATE INDEX)
maintenance_work_mem = 128MB

# Memory for WAL buffers
wal_buffers = 16MB

# Effective cache size (hint to planner, ~75% of available RAM)
effective_cache_size = 1GB

# =============================================================================
# WRITE-AHEAD LOG (WAL) SETTINGS
# =============================================================================
# WAL level for point-in-time recovery
wal_level = replica

# Ensure data durability - critical for financial/fiduciary data
fsync = on
synchronous_commit = on
full_page_writes = on

# Checkpoint settings
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 1GB
min_wal_size = 80MB

# =============================================================================
# LOGGING - AUDIT TRAIL
# =============================================================================
# Where to log
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = off

# What to log
log_destination = 'stderr'
log_min_messages = warning
log_min_error_statement = error

# Log connections and disconnections (audit trail)
log_connections = on
log_disconnections = on

# Log all DDL statements (schema changes)
log_statement = 'ddl'

# Log slow queries (adjust threshold as needed)
log_min_duration_statement = 1000

# Log lock waits
log_lock_waits = on
deadlock_timeout = 1s

# Log checkpoints
log_checkpoints = on

# Include useful info in logs
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_timezone = 'America/Chicago'

# =============================================================================
# SECURITY SETTINGS
# =============================================================================
# Password encryption (SCRAM-SHA-256 is more secure than MD5)
password_encryption = scram-sha-256

# Row security policies
row_security = on

# SSL (disabled for local Docker network, enable if exposing externally)
ssl = off

# =============================================================================
# LOCALE AND FORMATTING
# =============================================================================
datestyle = 'iso, mdy'
timezone = 'America/Chicago'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# =============================================================================
# AUTOVACUUM - KEEP DATABASE HEALTHY
# =============================================================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# =============================================================================
# STATISTICS
# =============================================================================
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# =============================================================================
# CLIENT CONNECTION DEFAULTS
# =============================================================================
statement_timeout = 300000
idle_in_transaction_session_timeout = 600000
